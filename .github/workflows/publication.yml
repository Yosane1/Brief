# Étape 3 du pipeline du soir : pousser l'édition rédigée vers Airtable.
#
# Se déclenche dès que la routine Claude dépose un fichier dans editions/.
# La session Claude ne peut pas joindre api.airtable.com ; GitHub, si.

name: Publication vers Airtable

on:
  push:
    paths:
      # Les éditions sont rangées par année : editions/2026/2026-08-11.json.
      # Le motif du fichier commence par un chiffre, si bien que _modele.json —
      # resté à la racine du dossier — ne déclenche jamais de publication.
      - "editions/*/[0-9]*.json"
  workflow_dispatch:
    inputs:
      edition:
        description: "Date de l'édition à republier (AAAA-MM-JJ)"
        required: false

jobs:
  publier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # nécessaire pour comparer au commit précédent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Identifier les éditions à publier
        id: cibles
        run: |
          if [ -n "${{ github.event.inputs.edition }}" ]; then
            jour="${{ github.event.inputs.edition }}"
            fichiers="editions/${jour%%-*}/${jour}.json"   # l'année préfixe la date
          else
            fichiers=$(git diff --name-only HEAD~1 HEAD -- 'editions/*/[0-9]*.json' || true)
          fi
          if [ -z "$fichiers" ]; then
            echo "Aucune édition modifiée."
          fi
          echo "fichiers<<EOF" >> $GITHUB_OUTPUT
          echo "$fichiers" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publier dans Airtable
        if: steps.cibles.outputs.fichiers != ''
        env:
          # Renseignez le secret AIRTABLE_TOKEN pour sortir le jeton du code.
          # S'il est absent, les scripts retombent sur la valeur du dépôt.
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          for f in ${{ steps.cibles.outputs.fichiers }}; do
            [ -f "$f" ] || continue
            echo "── $f"
            python scripts/push_edition.py "$f"
            python scripts/verifier_edition.py "$(basename "$f" .json)"
          done

      - name: Annoncer la parution aux abonnés
        if: steps.cibles.outputs.fichiers != ''
        env:
          DIFFUSION_SECRET: ${{ secrets.DIFFUSION_SECRET }}
          PASSERELLE: https://brief.jamet-aymeric-pro.workers.dev
        run: |
          if [ -z "$DIFFUSION_SECRET" ]; then
            echo "::warning::DIFFUSION_SECRET absent — aucune notification envoyée."
            exit 0
          fi
          # La passerelle choisit la dernière édition publiée et n'annonce
          # jamais deux fois la même : relancer le workflow est sans risque.
          reponse=$(curl -sS -X POST "$PASSERELLE/diffuser" \
            -H "X-Diffusion: $DIFFUSION_SECRET" \
            -H "Content-Type: application/json" -d '{}')
          echo "$reponse"
          echo "$reponse" | grep -q '"echecs":0' || echo "::warning::Des envois ont échoué."
